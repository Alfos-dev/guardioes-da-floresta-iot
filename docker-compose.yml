services:
  influxdb:
    image: influxdb:2.7
    container_name: influxdb
    restart: unless-stopped
    ports:
      - "8086:8086"
    volumes:
      - influxdb_data:/var/lib/influxdb2
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUX_INIT_USERNAME}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUX_INIT_PASSWORD}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUX_ORG}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUX_BUCKET}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUX_TOKEN}

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - influxdb
    environment:
      - GF_PANELS_DISABLE_SANITIZE_HTML=true

  # ---- v2: MQTT broker (single ingestion transport) ----
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./services/mosquitto:/mosquitto/config
      - mosquitto_data:/mosquitto/data

  # ---- v2: single ingestion service (MQTT -> InfluxDB + SQLite) ----
  ingest_service:
    build: ./services/ingest_service
    container_name: ingest_service
    restart: unless-stopped
    environment:
      PYTHONUNBUFFERED: "1"
      MQTT_HOST: mosquitto
      MQTT_PORT: "1883"
      MQTT_USER: ${MQTT_USER}
      MQTT_PASS: ${MQTT_PASS}
      INFLUX_URL: ${INFLUX_URL}
      INFLUX_TOKEN: ${INFLUX_TOKEN}
      INFLUX_ORG: ${INFLUX_ORG}
      INFLUX_BUCKET: ${INFLUX_BUCKET}
      SQLITE_PATH: /data/devices.db
    volumes:
      - devices_data:/data
    depends_on:
      - mosquitto
      - influxdb

  # ---- v2: serial bridge now publishes to MQTT (no longer writes to InfluxDB) ----
  serial_bridge:
    build: ./bridge
    container_name: serial_bridge
    restart: unless-stopped
    environment:
      PYTHONUNBUFFERED: "1"
      SERIAL_PORT: /dev/ttyUSB0
      BAUD: "115200"
      MQTT_HOST: mosquitto
      MQTT_PORT: "1883"
      MQTT_USER: ${MQTT_USER}
      MQTT_PASS: ${MQTT_PASS}
      DEVICE_ID: ${SERIAL_DEVICE_ID:-esp32s3_serial}
    devices:
      - "/dev/ttyUSB0:/dev/ttyUSB0"
    depends_on:
      - mosquitto

  moon_service:
    build: ./moon
    container_name: moon_service
    restart: unless-stopped
    environment:
      PYTHONUNBUFFERED: "1"
      INFLUX_URL: ${INFLUX_URL}
      INFLUX_TOKEN: ${INFLUX_TOKEN}
      INFLUX_ORG: ${INFLUX_ORG}
      INFLUX_BUCKET: ${INFLUX_BUCKET}
    depends_on:
      - influxdb

  # ---- v2 Fase 3: Painel de Administração Web ----
  admin_panel:
    build: ./admin_panel
    container_name: admin_panel
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      PYTHONUNBUFFERED: "1"
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      MQTT_HOST: mosquitto
      MQTT_PORT: "1883"
      MQTT_USER: ${MQTT_USER}
      MQTT_PASS: ${MQTT_PASS}
      INFLUX_URL: ${INFLUX_URL}
      INFLUXDB_ADMIN_TOKEN: ${INFLUX_TOKEN}
      INFLUXDB_ORG: ${INFLUX_ORG}
      INFLUXDB_BUCKET: ${INFLUX_BUCKET}
      SQLITE_PATH: /data/devices.db
    volumes:
      - devices_data:/data
      - ./firmware-v2:/firmware-v2:ro  # Firmware source (read-only) para builds
    depends_on:
      - mosquitto
      - influxdb
      - ingest_service

volumes:
  influxdb_data:
  grafana_data:
  mosquitto_data:
  devices_data:
