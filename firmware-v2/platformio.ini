; Guardioes da Floresta - Firmware v2.0
; PlatformIO project - local/offline build.
;
; Supported boards:
;   - ESP32-S3 DevKit C-1 (recommended for new projects)
;   - ESP32 DOIT DevKit V1 (cost-effective alternative)
;
; Build examples:
;   ESP32-S3:  pio run -e esp32s3_v2
;   ESP32:     pio run -e esp32_doit_v2
;
; Upload:  pio run -e <environment> -t upload
; Monitor: pio device monitor -b 115200
;
; The v1 firmware still lives at the repository root (src/, platformio.ini).
; This is the new modular, MQTT-based v2 firmware and it is fully isolated here.

; ============================================================================
; ESP32-S3 DevKit C-1 (Dual-core Xtensa LX7, 8MB Flash, BLE 5.0)
; ============================================================================
[env:esp32s3_v2]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

; Library dependencies (cached locally on first resolve for offline builds).
lib_deps =
    knolleary/PubSubClient @ ^2.8
    adafruit/Adafruit AHTX0 @ ^2.0.5
    adafruit/Adafruit Unified Sensor @ ^1.1.7
    bblanchon/ArduinoJson @ ^7.0.4

; Firmware version exposed to the code and published in the status payload.
build_flags =
    -D FIRMWARE_VERSION=\"2.0.0\"
    -D BOARD_TYPE=\"ESP32-S3\"

; ============================================================================
; ESP32 DOIT DevKit V1 (Dual-core Xtensa LX6, 4MB Flash, BLE 4.2)
; More affordable alternative, widely available in Brazil
; ============================================================================
[env:esp32_doit_v2]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200

; Same library dependencies as ESP32-S3
lib_deps =
    knolleary/PubSubClient @ ^2.8
    adafruit/Adafruit AHTX0 @ ^2.0.5
    adafruit/Adafruit Unified Sensor @ ^1.1.7
    bblanchon/ArduinoJson @ ^7.0.4

; Firmware version and board type
build_flags =
    -D FIRMWARE_VERSION=\"2.0.0\"
    -D BOARD_TYPE=\"ESP32\"
