# Mosquitto 2.x configuration - Guardioes da Floresta v2.
#
# Authentication is mandatory (RF27 / RNF05): anonymous access is disabled and
# credentials are read from a password file generated by the installer.
# Retained messages are persisted so config topics survive a broker restart.

listener 1883

# --- Authentication ---
allow_anonymous false
password_file /mosquitto/config/passwd

# --- Persistence (retained messages + queued QoS 1) ---
persistence true
persistence_location /mosquitto/data/

# --- Logging ---
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
